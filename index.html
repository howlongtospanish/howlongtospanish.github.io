<style>
/* Layout: the look of the "English as a Project" talk (shared with How Long to English?) — cream page, sand step cards, navy for the result and for chosen options, rust as the one accent.
   Two columns on wide screens (form + sticky navy result card), one column on phones. */
:root{
  --bg:#FAF6EE; --panel:#F1E9DA; --field:#FAF6EE; --ink:#1F2A44; --body:#414B5E; --muted:#6A6F7A;
  --line:#E4D7BF; --dash:#B8A585; --track:#EDE3D0;
  --accent:#A8471A; --accent-soft:#F0D9CB; --on-accent:#FAF6EE;
  --sel:#1F2A44; --on-sel:#FAF6EE;
  /* result card: navy island in both themes */
  --card:#1F2A44; --card-ink:#FAF6EE; --card-muted:#C4C0B6; --card-line:#33405F; --card-track:#33405F; --hi:#F2A65A; --card-soft:#2A3756;
  --display:"Domine", Georgia, "Times New Roman", serif;
  --font:"Nunito Sans", "Segoe UI", Arial, "Noto Sans", sans-serif;
  --r:20px; --r-sm:12px;
  color-scheme:light;
}
/* Light is the default for everyone; dark only when the visitor picks it with the page's own switch. */
:root.dark{
  --bg:#141A2B; --panel:#1C2438; --field:#141A2B; --ink:#F3EDE1; --body:#D3CDBF; --muted:#A3A6B0;
  --line:#2E3850; --dash:#5B6683; --track:#2A3349;
  --accent:#F2A65A; --accent-soft:#3A2C22; --on-accent:#1F2A44;
  --sel:#F2A65A; --on-sel:#1F2A44;
  --card:#26314D; --card-line:#3A4766; --card-track:#3A4766; --card-soft:#303C5C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:16px;line-height:1.5;padding-inline:24px;padding-block:24px 56px}
.wrap{max-width:1160px;margin-inline:auto}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{color:var(--ink)}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-block:4px 28px}
.brand{display:flex;flex-direction:column;gap:8px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:0;font-family:var(--display);font-size:clamp(34px,4.4vw,52px);font-weight:700;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--body);font-size:18px;max-width:52ch}
.controls{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.langpick{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
select,input[type=text]{font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding-block:8px;padding-inline:12px}

/* grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:28px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}

/* steps */
.form{display:flex;flex-direction:column;gap:16px;min-width:0}
.step{background:var(--panel);border-radius:var(--r);padding-block:22px;padding-inline:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
/* native language is required: pressing the result button without it brings you here and nudges the card */
.need{margin:0;color:var(--accent);font-weight:700;font-size:15.5px}
.need[hidden]{display:none}
.step.need-pick{box-shadow:0 0 0 3px var(--accent);animation:nudge .55s ease-in-out 2}
@keyframes nudge{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@media (prefers-reduced-motion: reduce){.step.need-pick{animation:none}}
.step-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.step-n{font-family:var(--display);font-size:20px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.step-h h2{margin:0;font-family:var(--display);font-size:21px;font-weight:700;line-height:1.25}
.step-h .aside{margin-inline-start:auto;font-size:14px;color:var(--muted)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding-block:7px;padding-inline:14px;cursor:pointer;line-height:1.3;transition:background .15s,border-color .15s,color .15s}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.chip:disabled{opacity:.35;cursor:not-allowed;background:transparent;border-style:dashed;border-color:var(--dash)}
.chip.lvl{min-width:50px;font-variant-numeric:tabular-nums;text-align:center}

/* purpose cards */
.purposes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pcard{font:inherit;text-align:start;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding-block:12px;padding-inline:14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s}
.pcard:hover{border-color:var(--ink)}
.pcard b{font-family:var(--display);font-weight:700;font-size:16px}
.pcard span{font-size:13.5px;color:var(--muted);line-height:1.4}
.pcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}

/* segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--field)}
.seg button{font:inherit;font-size:14px;font-weight:600;background:transparent;color:var(--muted);border:0;padding-block:6px;padding-inline:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel)}

/* level ladder: whole levels are single buttons; with steps, a level's steps sit together under one label */
.ladder{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:3px}
.glabel{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-align:center;color:var(--muted);border-bottom:2px solid var(--line);padding-block-end:1px}
.grp.on .glabel{color:var(--accent);border-color:var(--accent)}
.gcells{display:flex}
.cell{font:inherit;font-size:14.5px;font-weight:700;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);min-width:44px;height:38px;padding-inline:8px;cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s,color .15s}
.grp.sub .cell{min-width:30px;padding-inline:4px;border-radius:0}
.grp.sub .cell:first-child{border-start-start-radius:var(--r-sm);border-end-start-radius:var(--r-sm)}
.grp.sub .cell:last-child{border-start-end-radius:var(--r-sm);border-end-end-radius:var(--r-sm)}
.grp.sub .cell + .cell{border-inline-start-width:0}
.cell:hover:not(:disabled){background:var(--accent-soft)}
.cell[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.cell:disabled{opacity:.35;cursor:not-allowed;background:transparent;border-style:dashed;border-color:var(--dash)}

/* skill rows */
.rows{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:end}
.srow .sname{padding-block-end:8px}
.srow .sname{font-size:15px;font-weight:700;color:var(--ink)}
@media (max-width:540px){.srow{grid-template-columns:minmax(0,1fr);gap:6px}}
.lvlnote{font-size:14.5px;color:var(--body);min-height:1.5em}
.lvlnote b{font-family:var(--display);color:var(--accent);font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--body);cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;margin:0;flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid var(--dash);background:var(--field);display:grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s}
.check input::after{content:"";width:6px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg);opacity:0}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{opacity:1}

details.help{font-size:14.5px}
details.help summary{cursor:pointer;color:var(--accent);font-weight:700}
details.help .in{display:flex;flex-direction:column;gap:10px;padding-block:12px 2px}
.lvl-list{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;margin:0}
.lvl-list dt{font-family:var(--display);font-weight:700;color:var(--ink)}
.lvl-list dd{margin:0;color:var(--body)}
.tests{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.tests li span{color:var(--muted)}

/* language distance chart (from the talk) */
:root{ --c1:#D9A24E; --c2:#7E9C8A; --c3:#A8471A; --c4:#1F2A44 }
:root.dark{ --c1:#D9A24E; --c2:#8FB09C; --c3:#E0794B; --c4:#C9CFDE }
.dist-title{font-family:var(--display);font-size:22px;font-weight:700;color:var(--ink);line-height:1.2}
.dist-lead{margin:0;font-size:14px;color:var(--body)}
.dist{display:flex;flex-direction:column;gap:12px;padding-block:4px}
.drow{display:flex;flex-direction:column;gap:5px}
.drow-top{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:15px;font-weight:700;color:var(--ink)}
.drow-top span:last-child{font-size:13.5px;font-weight:700;color:var(--muted)}
.drow.me .drow-top span{color:var(--accent)}
.drow-top{align-items:flex-end}
.drow-top .you{display:inline-block;color:var(--accent);margin-block:-8px -2px;pointer-events:none}
.you svg{width:28px;height:20px;flex-shrink:0;margin-block-start:6px;order:-1}
[dir=rtl] .you svg{transform:scaleX(-1)}
.drow.me .drow-top .you{color:var(--accent);font-family:"Caveat","Segoe Print","Bradley Hand",cursive;font-weight:600;font-size:23px;line-height:1;display:inline-block;transform:rotate(-4deg);white-space:nowrap}
.dtrack{position:relative;height:22px}
.dbar{position:absolute;inset-block:0;inset-inline-start:0;border-radius:11px;display:flex;align-items:center;justify-content:flex-end;padding-inline-end:9px;font-size:11.5px;font-weight:800;color:#FAF6EE}
.c1 .dbar{color:#1F2A44}
:root.dark .c4 .dbar{color:#1F2A44}

.dtrack.line::after{content:"";position:absolute;inset-inline-start:var(--at);top:-8px;bottom:-8px;border-inline-start:2px dashed var(--ink);z-index:2}

:root.dark .c4 .dseg b.on{color:#1F2A44}

.dist-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:var(--plot-h,240px);background:transparent;border:0;cursor:ew-resize}
.dist-slider::-moz-range-thumb{width:28px;height:var(--plot-h,240px);background:transparent;border:0;cursor:ew-resize}
.dist-slider:focus{outline:none}
.dist-grip{position:absolute;bottom:0;inset-inline-start:var(--at);transform:translateX(-50%);z-index:2;display:grid;place-items:center;width:40px;height:22px;
  border-radius:11px;background:var(--accent);color:var(--on-accent);box-shadow:0 2px 6px rgba(0,0,0,.18);pointer-events:none;transition:transform .12s}

[dir=rtl] .goal-note{transform:translateX(100%)}
.goal-note .gl-lines{display:flex;flex-direction:column;align-items:flex-end;font-family:"Caveat","Segoe Print","Bradley Hand",cursive;font-weight:600;font-size:21px;line-height:1.05;transform:rotate(-3deg);margin-block-end:8px}

.goal-note.flip{transform:none;flex-direction:row-reverse}

.dist-scale{position:relative;height:16px;font-size:11.5px;font-weight:700;color:var(--muted)}
.dist-scale span{position:absolute;transform:translateX(-50%)}
[dir=rtl] .dist-scale span{transform:translateX(50%)}
.reached{position:absolute;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:3px;color:var(--accent);pointer-events:none;white-space:nowrap}

[dir=rtl] .reached svg{transform:scaleX(-1)}
.reached span{font-family:"Caveat","Segoe Print","Bradley Hand",cursive;font-weight:600;font-size:22px;line-height:1;display:inline-block;transform:rotate(-3deg)}
.c1 .dbar{background:var(--c1)} .c2 .dbar{background:var(--c2)} .c3 .dbar{background:var(--c3)} .c4 .dbar{background:var(--c4)}
.dbar.rest{opacity:.3}

/* native search */

/* sliders */
.sliders{display:flex;flex-direction:column;gap:14px}

/* result card: navy, like the "My lesson" card in the talk */

/* perforation: the card's bottom edge keeps the top halves of the holes, the strip's top edge keeps the bottom halves */
.rcard.has-tear{border-end-start-radius:0;border-end-end-radius:0;padding-block-end:calc(var(--pad) - 4px);
  -webkit-mask:radial-gradient(circle at 7px 100%,#0000 4px,#000 4.6px) 0 0/14px 100% repeat-x,radial-gradient(circle at 0 100%,#0000 11px,#000 11.6px),radial-gradient(circle at 100% 100%,#0000 11px,#000 11.6px);
  -webkit-mask-composite:source-in;
  mask:radial-gradient(circle at 7px 100%,#0000 4px,#000 4.6px) 0 0/14px 100% repeat-x,radial-gradient(circle at 0 100%,#0000 11px,#000 11.6px),radial-gradient(circle at 100% 100%,#0000 11px,#000 11.6px);
  mask-composite:intersect}

.big{font-family:var(--display);font-size:clamp(46px,5.4vw,64px);font-weight:700;letter-spacing:-.01em;line-height:1;color:var(--hi);font-variant-numeric:tabular-nums}

/* a week of study, like the calendar on the talk's cover: one column per day, height = time, orange = with a teacher, cream = on your own */
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}

.iconbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;color:var(--card-ink);background:transparent;border:1px solid var(--card-line);border-radius:999px;padding-block:5px;padding-inline:10px;cursor:pointer}

a.iconbtn{text-decoration:none}
.wseg{display:inline-flex;border:1px solid var(--card-line);border-radius:999px;overflow:hidden}
.wseg button{font:inherit;font-size:13px;font-weight:700;color:var(--card-muted);background:transparent;border:0;padding-block:5px;padding-inline:11px;cursor:pointer}
.wseg button[aria-pressed="true"]{background:var(--hi);color:#1F2A44}
.iconbtn.icononly{padding-inline:7px}
.iconbtn svg{width:16px;height:16px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:start}
.day{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0;border-radius:8px;outline-offset:3px}
/* instant tooltip (the browser's own title tooltip waits about a second) */
.day::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:pre;z-index:2;
  background:var(--card-ink);color:#1F2A44;font-size:12.5px;font-weight:700;line-height:1.45;padding-block:6px;padding-inline:10px;border-radius:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;visibility:hidden;pointer-events:none}
.day:nth-child(-n+2)::after{left:0;transform:none}
.day:nth-last-child(-n+2)::after{left:auto;right:0;transform:none}
.day:hover::after,.day:focus-visible::after{opacity:1;visibility:visible}
.day:hover .col{box-shadow:0 0 0 2px var(--hi)}

.day.rest .lbl{color:var(--card-muted)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--card-muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}

/* skill bars on a Cambridge-hours scale */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-direction:column;gap:5px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}

.track{position:relative;height:12px;border-radius:6px;background:var(--card-track)}

[dir=rtl] .dot{transform:translateX(50%)}
.scale{position:relative;height:16px;font-size:11px;color:var(--card-muted);font-variant-numeric:tabular-nums}
.scale span{position:absolute;transform:translateX(-50%)}
[dir=rtl] .scale span{transform:translateX(50%)}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.whatif{background:var(--card-soft);border-radius:var(--r-sm);padding-block:12px;padding-inline:14px;font-size:15px}

.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* share card: the talk's "My English plan" card (here: "My Spanish plan") — sand, navy text, rust day boxes */
.scard{background:#F1E9DA;color:#1F2A44;border-radius:var(--r);padding-block:22px;padding-inline:22px;display:flex;flex-direction:column;gap:14px}
.scard-brand{font-family:var(--display);font-size:19px;font-weight:700;color:#A8471A}
.scard-big{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1}
.scard-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.scard-days span{height:28px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#A8471A;color:#FAF6EE;font-size:12px;font-weight:700}
.scard-goal{font-size:17px;line-height:1.4;color:#414B5E}

.scard-ft{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;font-size:15px;font-weight:700;color:#1F2A44;border-top:1px solid #E4D7BF;padding-block-start:12px}
.scard-cta{background:#A8471A;color:#FAF6EE;border-radius:999px;padding-block:6px;padding-inline:14px;font-size:14px}
/* "tear it off, take it with you": the share part hangs under the result like a tear-off strip on a street notice.
   A row of punched holes marks the fold; a moment after the result appears, the strip comes loose on the left. */
.tear{position:relative;padding-block:26px 24px;padding-inline:var(--pad);
  background:#F1E9DA;color:#1F2A44;border-radius:0 0 var(--r) var(--r);display:flex;flex-direction:column;gap:12px;transform-origin:100% 0;
  -webkit-mask:radial-gradient(circle at 7px 0,#0000 4px,#000 4.6px) 0 0/14px 100% repeat-x,radial-gradient(circle at 0 0,#0000 11px,#000 11.6px),radial-gradient(circle at 100% 0,#0000 11px,#000 11.6px);
  -webkit-mask-composite:source-in;
  mask:radial-gradient(circle at 7px 0,#0000 4px,#000 4.6px) 0 0/14px 100% repeat-x,radial-gradient(circle at 0 0,#0000 11px,#000 11.6px),radial-gradient(circle at 100% 0,#0000 11px,#000 11.6px);
  mask-composite:intersect}
@keyframes tearOff{0%{transform:none}50%{transform:translateY(12px) rotate(-3.6deg)}72%{transform:translateY(7px) rotate(-2.1deg)}88%{transform:translateY(9px) rotate(-2.8deg)}100%{transform:translateY(8px) rotate(-2.5deg)}}
.tear.tearing{animation:tearOff 1.2s cubic-bezier(.3,.7,.3,1) 1.4s both}

@media (prefers-reduced-motion: reduce){.tear.tearing{animation:none;transform:translateY(8px) rotate(-2.5deg)}}
.tear h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A8471A}

.tear .slink:hover,.tear .btn2:hover,.tear .iconbtn:hover{border-color:#A8471A;color:#A8471A}
.tear .copied{color:#6A6F7A}

.slinks{display:flex;flex-wrap:wrap;gap:6px}

@media (max-width:540px){

<body>


<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <span class="kicker" data-t="kicker"></span>
      <h1 data-t="title"></h1>
      <p data-t="tagline"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" id="themeSeg">
        <button type="button" data-theme-pick="light" data-t="light"></button>
        <button type="button" data-theme-pick="dark" data-t="dark"></button>
      </div>
      <label class="langpick"><span data-t="pageLang"></span>
        <select id="pageLang"></select>
      </label>
    </div>
  </header>

  <div class="shared" id="sharedBar" hidden>
    <span data-t="sharedMsg"></span>
    <button type="button" class="go small" id="ownBtn" data-t="sharedBtn"></button>
    <button type="button" class="xbtn" id="sharedClose" aria-label="×">×</button>
  </div>

  <div class="grid">
    <main class="form">

      <section class="step" aria-labelledby="h-purpose">
        <div class="step-h"><span class="step-n">1</span><h2 id="h-purpose" data-t="qPurpose"></h2><span class="aside" data-t="pickMany"></span></div>
        <div class="purposes" id="purposes"></div>
      </section>

      <section class="step" id="stepNative" aria-labelledby="h-native">
        <div class="step-h"><span class="step-n">2</span><h2 id="h-native" data-t="qNative"></h2></div>
        <p class="need" id="needNative" role="alert" data-t="needNative" hidden></p>
        <div class="chips" id="nativeChips"></div>
        <div class="search">
          <input type="text" id="nativeSearch" list="nativeList" autocomplete="off">
          <datalist id="nativeList"></datalist>
          <span class="picked" id="nativePicked"></span>
        </div>
        <details class="help" id="whyNative">
          <summary data-t="whyNative"></summary>
          <div class="in" id="distChart"></div>
        </details>
      </section>

      <section class="step" aria-labelledby="h-level">
        <div class="step-h"><span class="step-n">3</span><h2 id="h-level" data-t="qLevel"></h2>
          <div class="seg aside levelSeg" role="group">
            <button type="button" data-steps="0" data-t="wholeLevels"></button>
            <button type="button" data-steps="1" data-t="withSteps"></button>
          </div>
        </div>
        <div id="curRows" class="rows"></div>
        <label class="check"><input type="checkbox" id="linkCur" checked> <span data-t="linkCur"></span></label>
        <details class="help" id="levelHelp">
          <summary data-t="notSure"></summary>
          <div class="in">
            <dl class="lvl-list" id="lvlList"></dl>
            <div><b data-t="freeTests"></b></div>
            <ul class="tests" id="testList"></ul>
          </div>
        </details>
      </section>

      <section class="step" aria-labelledby="h-goal">
        <div class="step-h"><span class="step-n">4</span><h2 id="h-goal" data-t="qGoal"></h2>
          <div class="seg aside levelSeg" role="group">
            <button type="button" data-steps="0" data-t="wholeLevels"></button>
            <button type="button" data-steps="1" data-t="withSteps"></button>
          </div>
        </div>
        <div class="rows" id="goalRows"></div>
        <label class="check"><input type="checkbox" id="linkGoals" checked> <span data-t="linkGoals"></span></label>
      </section>

      <section class="step" aria-labelledby="h-time">
        <div class="step-h"><span class="step-n">5</span><h2 id="h-time" data-t="qTime"></h2></div>
        <div class="presets" id="presets"></div>
        <div class="sliders">
          <div class="sl">
            <div class="sl-top"><label for="tHours" data-t="withTeacher"></label><output id="tOut" for="tHours"></output></div>
            <input type="range" id="tHours" min="0" max="20" step="0.5">
          </div>
          <div class="sl">
            <div class="sl-top"><label for="sHours" data-t="onOwn"></label><output id="sOut" for="sHours"></output></div>
            <input type="range" id="sHours" min="0" max="40" step="0.5">
          </div>
        </div>
        <div class="hint" data-t="ratioHint"></div>
      </section>

      <button class="go" id="goBtn" type="button" data-t="go"></button>
    </main>

    <aside class="result" id="result" aria-live="polite"></aside>
  </div>

  <details class="how" id="how">
    <summary data-t="howTitle"></summary>
    <div class="in" id="howBody"></div>
  </details>

  <details class="how" id="easier">
    <summary id="easierTitle"></summary>
    <div class="in" id="easierBody"></div>
  </details>

  <footer>
    <span data-t="madeBy"></span>
    <span data-t="privacy"></span>
    <button type="button" class="linkish" id="consentOpen" data-t="consentLink" hidden></button>
    <span id="credit"></span>
  </footer>
</div>

<div class="consent" id="consent" role="dialog" aria-live="polite" aria-labelledby="consentText" hidden>
  <p id="consentText" data-t="consentText"></p>
  <div class="btns">
    <button type="button" class="yes" id="consentYes" data-t="consentYes"></button>
    <button type="button" class="no" id="consentNo" data-t="consentNo"></button>
  </div>
</div>

/* name, code, factor = how far the language is from Spanish. Our estimate:

const $ = (id) => document.getElementById(id);
const T = () => STR_FULL[state.lang] || STR_FULL.en;
/* language names in the page language (Intl), with our English names as the fallback */
const dnCache = {};
/* browsers show code "tl" as Filipino; we mean Tagalog */
const NAME_FIX = { tl: { uk: "тагальська", es: "tagalo", zh: "他加禄语", ko: "타갈로그어", fa: "تاگالوگ" } };
function nameOf(code, en){
  if (state.lang === "en" || !code || code === "sh") return en;   // "sh" would read as Serbian only
  if (NAME_FIX[code] && NAME_FIX[code][state.lang]) return NAME_FIX[code][state.lang];
  try {
    const dn = dnCache[state.lang] || (dnCache[state.lang] = new Intl.DisplayNames([state.lang], { type: "language" }));
    const n = dn.of(code);
    return n && n !== code ? n : en;
  } catch (e) { return en; }
}
const cap = (w) => w ? w.charAt(0).toLocaleUpperCase(state.lang) + w.slice(1) : w;
const base = (l) => l.split(".")[0];
const stepNo = (l) => l.includes(".") ? +l.split(".")[1] : 1;
function rank(l){ const b = base(l), i = LEVELS.indexOf(b), n = STEPS[b]; return n ? i + (stepNo(l) - 1) / n : i; }
function hrs(l, j){
  const b = base(l), n = STEPS[b];
  if (!n || stepNo(l) === 1) return GLH[b][j];
  const nx = LEVELS[LEVELS.indexOf(b) + 1];
  return GLH[b][j] + (stepNo(l) - 1) / n * (GLH[nx][j] - GLH[b][j]);
}
const mid = (l) => (hrs(l, 0) + hrs(l, 1)) / 2;
const isLevel = (l) => typeof l === "string" && LEVELS.includes(base(l)) && (!l.includes(".") || (STEPS[base(l)] && stepNo(l) >= 1 && stepNo(l) <= STEPS[base(l)]));
function levelOptions(){ return state.steps ? LEVELS.flatMap(L => STEPS[L] ? Array.from({ length: STEPS[L] }, (_, i) => `${L}.${i + 1}`) : [L]) : LEVELS; }
function toMode(l, steps){ if (!l) return l; const b = base(l); return steps && STEPS[b] ? (l.includes(".") ? l : b + ".1") : b; }
const fmtH = (h) => (Math.round(h * 2) / 2).toString();
const nf = () => new Intl.NumberFormat(state.lang);
const monthFmt = () => new Intl.DateTimeFormat(state.lang, { month: "short", year: "numeric" });
function fmtDur(h){
  const t = T(); let m = Math.round(h * 60 / 5) * 5;
  if (m <= 0) return "—";
  const hh = Math.floor(m / 60), mm = m % 60;
  const u = (x) => x.replace(/^ /, "\u00A0");   // keep "15" and "хв" together
  return hh && mm ? `${hh}${u(t.hU)} ${mm}${u(t.mU)}` : hh ? `${hh}${u(t.hU)}` : `${mm}${u(t.mU)}`;
}
/* Spread the week's hours over 7 days: lessons of up to 1 h with a teacher, self-study in 15-min pieces, some rest days. Totals stay the same. */
function shuffleWeek(T_, S_){
  const tU = Math.round(T_ * 4), sU = Math.round(S_ * 4);
  const totalU = tU + sU;
  const lessons = []; for (let left = tU; left > 0; left -= 4) lessons.push(Math.min(4, left));
  let rest = totalU < 28 ? 2 + Math.floor(Math.random() * 2) : Math.floor(Math.random() * 3);
  rest = Math.min(rest, 7 - Math.max(1, Math.min(7, Math.ceil(totalU / 16)))); // keep days under ~4 h
  const order = [0,1,2,3,4,5,6].sort(() => Math.random() - .5);
  const active = order.slice(0, 7 - Math.max(0, rest));
  const days = Array.from({ length: 7 }, () => ({ t: 0, s: 0 }));
  const shuffledActive = active.slice().sort(() => Math.random() - .5);
  lessons.forEach((u, i) => { days[shuffledActive[i % shuffledActive.length]].t += u; });
  const w = active.map(() => .5 + Math.random());
  const wsum = w.reduce((a, b) => a + b, 0);
  let given = 0;
  active.forEach((d, i) => { const u = Math.floor(sU * w[i] / wsum); days[d].s += u; given += u; });
  for (let i = 0; given < sU; i = (i + 1) % active.length){ days[active[Math.floor(Math.random() * active.length)]].s += 1; given += 1; }
  return days.map(d => ({ t: d.t / 4, s: d.s / 4 }));
}
function addWeeks(w){ const d = new Date(); d.setDate(d.getDate() + Math.round(w * 7)); return d; }

/* ===== Calculation (pure) ===== */
function multiplier(code){
  const hit = ALL_NATIVE.find(n => n[1] === code);
  return hit ? catFactor(hit[2]) : 1.0;
}
function compute(st){
  const included = SKILLS.filter(k => st.goal[k] && rank(st.goal[k]) > rank(st.cur[k]));
  const weekly = st.t + st.s;
  const m = multiplier(st.native);
  if (!included.length) return { status: "reached" };
  if (weekly <= 0) return { status: "nohours" };
  const gaps = included.map(k => ({
    k,
    lo: hrs(st.goal[k], 0) - hrs(st.cur[k], 0),
    hi: hrs(st.goal[k], 1) - hrs(st.cur[k], 1),
    mid: mid(st.goal[k]) - mid(st.cur[k])
  }));
  const n = gaps.length;
  const avgLo = gaps.reduce((a,g) => a + g.lo, 0) / n;
  const avgHi = gaps.reduce((a,g) => a + g.hi, 0) / n;
  const hoursLo = 3 * m * avgLo, hoursHi = 3 * m * avgHi;
  const weeksLo = hoursLo / weekly, weeksHi = hoursHi / weekly;
  const weeksMid = (weeksLo + weeksHi) / 2;
  const sumMid = gaps.reduce((a,g) => a + g.mid, 0);
  const perSkill = Object.fromEntries(gaps.map(g => [g.k, weekly * g.mid / sumMid]));
  // biggest gap: path for the timeline (speaking wins ties)
  const big = gaps.slice().sort((a,b) => b.mid - a.mid || SKILLS.indexOf(a.k) - SKILLS.indexOf(b.k))[0];
  const curL = st.cur[big.k], goalL = st.goal[big.k];
  const points = LEVELS.filter(L => rank(L) > rank(curL) && rank(L) < rank(goalL));
  points.push(goalL);
  const milestones = points.map(L => ({ level: L, weeks: (mid(L) - mid(curL)) / big.mid * weeksMid, goal: L === goalL }));
  // what if: +30 min a day on your own
  const weeksMidPlus = ((hoursLo + hoursHi) / 2) / (weekly + 3.5);
  const savedMonths = (weeksMid - weeksMidPlus) / 4.35;
  return {
    status: "ok", m, n, included, hoursLo, hoursHi, weeksLo, weeksHi, weeksMid,
    teacherShare: st.t / weekly, perSkill, big: big.k, milestones, savedMonths,
    warnRatio: st.s < 2 * st.t,
    warnSpeak: included.includes("sp") && st.t === 0
  };
}

/* "Why we ask": four roads on one hours scale. Each road is the level ladder (Cambridge hours) stretched by the
   language factor, so the same line of hours crosses each road at a different level. The line can be dragged.
   The visitor's language takes the place of the example in its group. */
const DIST_GROUPS = [
  { f: 0.7, ex: "Portuguese", code: "pt", cls: "c1" },
  { f: 0.9, ex: "English", code: "en", cls: "c2" },
  { f: 1.0, ex: "Ukrainian", code: "uk", cls: "c3" },
  { f: 1.3, ex: "Korean", code: "ko", cls: "c4" }
];
const DIST_STEPS = ["A0","A1","A2","B1","B2","C1","C2"];
function levelAfter(at, x){
  // the level reached after x teacher hours; "+" once past the middle of a level (CEFR plus levels)
  let i = 0; DIST_STEPS.forEach((L, k) => { if (at(L) <= x) i = k; });
  const L = DIST_STEPS[i], nx = DIST_STEPS[i + 1];
  if (!nx || L === "A0") return L;
  return (x - at(L)) / (at(nx) - at(L)) >= .5 ? L + "+" : L;
}
function renderDist(){
  const t = T(); const box = $("distChart"); box.innerHTML = "";
  const pick = ALL_NATIVE.find(n => n[1] === state.native);

  const lead = document.createElement("p"); lead.className = "dist-lead"; lead.textContent = t.distLead;
  const chart = document.createElement("div"); chart.className = "dist";
  const plot = document.createElement("div"); plot.className = "dist-plot";
  // hand-written hours note that follows the dashed line
  const axis = document.createElement("div"); axis.className = "dist-axis"; axis.setAttribute("aria-hidden", "true");
  const gl = document.createElement("span"); gl.className = "goal-note";
  const gt = document.createElement("span"); gt.className = "gl-lines";
  const gt1 = document.createElement("span"), gt2 = document.createElement("span"); gt.append(gt1, gt2); gl.append(gt);
  gl.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 20 22" aria-hidden="true"><path d="M4 2 C10 6 12 12 11 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M6 15 L11 20 L15.5 14.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  axis.appendChild(gl); plot.appendChild(axis);
  const rows = [];
  DIST_GROUPS.forEach(g => {
    const me = !!pick && catFactor(pick[2]) === g.f;
    const name = me ? nameOf(pick[1], pick[0]) : nameOf(g.code, g.ex);
    const at = (L) => L === "A0" ? 0 : mid(L) * g.f;      // teacher hours to reach level L
    const row = document.createElement("div"); row.className = "drow " + g.cls + (me ? " me" : "");
    const top = document.createElement("div"); top.className = "drow-top";
    const a = document.createElement("span"); a.textContent = t.speaker(name);
    top.append(a);
    const res = document.createElement("span"); res.className = "dres"; top.appendChild(res);
    const tr = document.createElement("div"); tr.className = "dtrack line"; tr.setAttribute("role", "img");
    const segs = [];
    for (let i = 0; i < DIST_STEPS.length - 1; i++){
      const L = DIST_STEPS[i], s0 = at(L), s1 = at(DIST_STEPS[i + 1]);
      const seg = document.createElement("div"); seg.className = "dseg";
      seg.style.insetInlineStart = pct(s0) + "%"; seg.style.width = `calc(${pct(s1 - s0)}% - 2px)`;

      tr.appendChild(seg); segs.push({ s0, s1, fill, lb });
    }
    const c2 = document.createElement("span"); c2.className = "dend"; c2.textContent = "C2"; c2.style.insetInlineStart = `calc(${pct(at("C2"))}% + 4px)`;
    tr.appendChild(c2);
    row.append(top, tr); plot.appendChild(row);
    rows.push({ at, segs, res, tr, name });
  });
  // the dashed line itself is the slider: an invisible range input lies over the roads, and its tall
  // transparent thumb sits right on the line, so you grab the line. A small grip at its foot shows where to hold.
  const sl = document.createElement("input");
  sl.type = "range"; sl.id = "distSlider"; sl.className = "dist-slider"; sl.min = 0; sl.max = MAX; sl.step = 50; sl.value = state.distAt;

  grip.innerHTML = '<svg viewBox="0 0 28 14"><path d="M9 3 L4 7 L9 11 M19 3 L24 7 L19 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  plot.append(sl, grip);
  chart.appendChild(plot);
  requestAnimationFrame(() => { plot.style.setProperty("--plot-h", plot.offsetHeight + "px"); });
  const sc = document.createElement("div"); sc.className = "dist-scale"; sc.setAttribute("aria-hidden", "true");
  [0, 400, 800, 1200, 1600].forEach(v => { const e = document.createElement("span"); e.textContent = nf().format(v * 3); e.style.insetInlineStart = pct(v) + "%"; sc.appendChild(e); });
  chart.append(sc);
  const paint = () => {
    // the line moves in hours with a teacher; everything shown is the total (× 3: 1 hour of class + 2 on your own)
    const AT = state.distAt, N = nf().format(AT * 3);
    chart.style.setProperty("--at", pct(AT) + "%");
    gt1.textContent = t.noteT(nf().format(AT));
    gt2.textContent = t.noteS(nf().format(AT * 2));
    gl.classList.toggle("flip", pct(AT) < 50);   // near the start, write the note on the other side of the line
    sl.setAttribute("aria-valuetext", t.hoursN(N));
    rows.forEach(r => {
      r.segs.forEach(sg => {
        const solid = Math.max(0, Math.min(1, (AT - sg.s0) / (sg.s1 - sg.s0)));
        sg.fill.style.width = (solid * 100) + "%";
        if (sg.lb) sg.lb.className = (sg.s0 + sg.s1) / 2 < AT ? "on" : "";
      });
      const c2 = r.at("C2");
      r.res.textContent = AT >= c2 ? t.c2At(nf().format(Math.round(c2 * 3 / 10) * 10)) : t.atN(levelAfter(r.at, AT), N);
      r.tr.setAttribute("aria-label", `${t.speaker(r.name)}: ${r.res.textContent}`);
    });
  };
  sl.addEventListener("input", () => { if (+sl.value < 50) sl.value = 50; state.distAt = +sl.value; paint(); });
  paint();
  const note = document.createElement("div"); note.className = "dist-note";
  // the takeaway, with the same names as the roads: how many times more hours the far road takes than the close one
  const last = DIST_GROUPS.length - 1, ratio = DIST_GROUPS[last].f / DIST_GROUPS[0].f;
  const nb = document.createElement("b"); nb.textContent = t.sameGoal; note.append(nb, " " + t.moreHours(rows[last].name, rows[0].name, nf().format(Math.round(ratio * 2) / 2)));
  const calc = document.createElement("p"); calc.className = "dist-lead";
  if (pick && !pick[2]) calc.textContent = t.noFsi(nameOf(pick[1], pick[0]));
  const src = document.createElement("p"); src.className = "dist-src"; src.textContent = t.distSrc;
  box.append(h, lead, chart, note);
  if (calc.textContent) box.appendChild(calc);
  box.appendChild(src);
}

/* One row of levels. With steps on, B1 and B2 become a joined group of steps under one label. */
function ladder(value, onPick, o){
  const t = T();
  const wrap = document.createElement("div"); wrap.className = "ladder";
  const cellBtn = (label, v, title, pressed, disabled, onClick) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "cell";
    b.textContent = label; b.title = title; b.setAttribute("aria-label", v || title);
    b.setAttribute("aria-pressed", pressed ? "true" : "false"); if (disabled) b.disabled = true;
    b.addEventListener("click", onClick); return b;
  };
  if (o.none){
    const g = document.createElement("div"); g.className = "grp";
    const c = document.createElement("div"); c.className = "gcells";
    c.appendChild(cellBtn(t.noGoal, "", t.noGoalTip, !value, false, o.onNone));
    g.appendChild(c); wrap.appendChild(g);
  }
  LEVELS.slice(LEVELS.indexOf(o.from)).forEach(L => {
    const g = document.createElement("div"); g.className = "grp";
    const c = document.createElement("div"); c.className = "gcells";
    if (state.steps && STEPS[L]){
      g.classList.add("sub");
      const lab = document.createElement("div"); lab.className = "glabel"; lab.textContent = L; g.appendChild(lab);
      for (let i = 1; i <= STEPS[L]; i++){
        const v = `${L}.${i}`;
        c.appendChild(cellBtn(String(i), v, `${v} · ${t.levels[L]}`, value === v, o.min && rank(v) < rank(o.min), () => onPick(v)));
      }
      if (value && base(value) === L) g.classList.add("on");
    } else {
      c.appendChild(cellBtn(L, L, t.levels[L], value === L, o.min && rank(L) < rank(o.min), () => onPick(L)));
    }
    g.appendChild(c); wrap.appendChild(g);
  });
  return wrap;
}
function setCur(k, L){
  if (state.linkCur) SKILLS.forEach(j => state.cur[j] = L); else state.cur[k] = L;
  update();
}
function setGoal(k, L){
  if (state.linkGoals){
    SKILLS.forEach(j => { if ((j === k || state.goal[j]) && rank(L) >= rank(state.cur[j])) state.goal[j] = L; });
  } else state.goal[k] = L;
  update();
}
function setSteps(on){
  state.steps = on;
  SKILLS.forEach(k => { state.cur[k] = toMode(state.cur[k], on); state.goal[k] = toMode(state.goal[k], on); });
  update();
}
function applyPurposes(){
  if (!state.purposes.size) return;
  SKILLS.forEach(k => {
    let best = null;
    state.purposes.forEach(p => { const v = PURPOSES[p][k]; if (v && (!best || rank(v) > rank(best))) best = v; });
    state.goal[k] = toMode(best, state.steps);
  });
}

/* The picture is drawn ahead of time (a moment after the result settles), because phones only open the share menu

const storyReady = { key: "", file: null, canvas: null };

function prepareStory(st){

    const cv = await drawStory(st);
    cv.toBlob(b => { if (!b) return; storyReady.key = key; storyReady.canvas = cv;
      storyReady.file = new File([b], "my-spanish-plan.png", { type: "image/png" }); }, "image/png");
  }, 350);

  const ol = document.createElement("ol"); h.steps.forEach(s => { const li = document.createElement("li"); li.textContent = s; ol.appendChild(li); });
  const fm = document.createElement("div"); fm.className = "formula";
  fm.textContent = h.formula;
  const tt = document.createElement("b"); tt.textContent = h.tableTitle;
  const tw = document.createElement("div"); tw.className = "tblwrap";
  const tb = document.createElement("table");
  tb.innerHTML = `<thead><tr>${LEVELS.slice(1).map(L => `<th>${L}</th>`).join("")}</tr></thead>
    <tbody><tr>${LEVELS.slice(1).map(L => `<td>${nf().format(GLH[L][0])}–${nf().format(GLH[L][1])}</td>`).join("")}</tr></tbody>`;
  tw.appendChild(tb);
  const gt = document.createElement("b"); gt.textContent = h.groupsTitle;
  const gw = document.createElement("div"); gw.className = "tblwrap";
  const gtab = document.createElement("table");
  h.groups.forEach(([m, l]) => { const tr = document.createElement("tr"); const a = document.createElement("td"); a.textContent = m; a.style.whiteSpace = "nowrap"; const b = document.createElement("td"); b.textContent = l; tr.append(a, b); gtab.appendChild(tr); });
  gw.appendChild(gtab);
  const st = document.createElement("b"); st.textContent = h.sourcesTitle;
  const ul = document.createElement("ul"); ul.className = "tests";
  h.sources.forEach(([n, u]) => { const li = document.createElement("li"); const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener"; a.textContent = n; li.appendChild(a); ul.appendChild(li); });
  body.append(p, ol, fm, tt, tw, gt, gw, st, ul);
}

const SITE_DOMAIN = "howlongtospanish.github.io";
/* ===== Share state in the address (#token, only letters, digits, dot, dash) ===== */
const PKEYS = Object.keys(PURPOSES);
/* Short link: #w-uk-1111-4443-6-12-11
   purposes (one letter each) - native language - current levels - goals - teacher half-hours - self half-hours - link flags.
   Levels: 0–6 = A0…C2, a–d = B1.1…B1.4, e–i = B2.1…B2.5, x = no goal. A letter in the levels means "with steps". */
const P_CODE = { work: "w", exam: "e", college: "c", everyday: "d", travel: "t", self: "s" };
const LV_CODE = { A0: "0", A1: "1", A2: "2", B1: "3", B2: "4", C1: "5", C2: "6",
  "B1.1": "a", "B1.2": "b", "B1.3": "c", "B1.4": "d", "B2.1": "e", "B2.2": "f", "B2.3": "g", "B2.4": "h", "B2.5": "i" };
const LV_DECODE = Object.fromEntries(Object.entries(LV_CODE).map(([k, v]) => [v, k]));
function encodeState(){
  const lv = (x) => x ? LV_CODE[x] : "x";
  return [
    PKEYS.filter(k => state.purposes.has(k)).map(k => P_CODE[k]).join("") || "x",
    state.native || "x",
    SKILLS.map(k => lv(state.cur[k])).join(""),
    SKILLS.map(k => lv(state.goal[k])).join(""),
    Math.round(state.t * 2),
    Math.round(state.s * 2),
    (state.linkCur ? 1 : 0) + "" + (state.linkGoals ? 1 : 0)
  ].join("-");
}
function decodeShort(h){
  const parts = h.replace(/^#/, "").split("-");
  if (parts.length !== 7 || parts[2].length !== 4 || parts[3].length !== 4) return false;
  const [pp, nat, cur, goal, tt, ss, fl] = parts;
  const back = Object.fromEntries(Object.entries(P_CODE).map(([k, v]) => [v, k]));
  state.purposes = new Set(pp === "x" ? [] : pp.split("").map(c => back[c]).filter(Boolean));
  state.native = nat === "x" ? null : nat;
  state.steps = /[a-i]/.test(cur + goal);
  SKILLS.forEach((k, i) => {
    const c = LV_DECODE[cur[i]]; if (c) state.cur[k] = toMode(c, state.steps);
    const g = LV_DECODE[goal[i]]; state.goal[k] = g ? toMode(g, state.steps) : null;
  });
  state.t = Math.min(20, Math.max(0, (+tt || 0) / 2));
  state.s = Math.min(40, Math.max(0, (+ss || 0) / 2));
  state.linkCur = fl[0] !== "0"; state.linkGoals = fl[1] !== "0";
  return true;
}
function decodeState(h){
  try {
    if (h && !h.includes("p.")) return decodeShort(h);
    if (!h || !h.includes("p.")) return false;
    const parts = Object.fromEntries(h.replace(/^#/, "").split("-").map(x => { const a = x.split("."); return [a[0], a.slice(1)]; }));
    if (parts.p) state.purposes = new Set(parts.p.filter(k => PKEYS.includes(k)));
    if (parts.n && parts.n[0] !== "none") state.native = parts.n[0];
    if (parts.m) state.steps = parts.m[0] === "s";
    const un = (x) => (x || "").replace("_", ".");
    if (parts.c && parts.c.length === 4) SKILLS.forEach((k, i) => { if (isLevel(un(parts.c[i]))) state.cur[k] = toMode(un(parts.c[i]), state.steps); });
    if (parts.g && parts.g.length === 4) SKILLS.forEach((k, i) => { state.goal[k] = isLevel(un(parts.g[i])) ? toMode(un(parts.g[i]), state.steps) : null; });
    if (parts.t) state.t = Math.min(20, Math.max(0, (+parts.t[0] || 0) / 2));
    if (parts.s) state.s = Math.min(40, Math.max(0, (+parts.s[0] || 0) / 2));
    if (parts.l) state.linkGoals = parts.l[0] === "1";
    if (parts.lc) state.linkCur = parts.lc[0] === "1";
    return true;
  } catch (e) { return false; }
}

/* ===== Wiring ===== */
/* The plan lives in the address (#...), so a reload keeps it. The browser also remembers the person's own last plan,
   so "This plan was shared with you" shows only for someone else's link, not when you reopen your own. */
let loadedHash = null;
function update(){
  if (state.native){ $("needNative").hidden = true; $("stepNative").classList.remove("need-pick"); }
  renderForm();
  renderResult();
  if (state.shown){
    const h = encodeState();
    try { history.replaceState(null, "", "#" + h); } catch (e) {}
    if (!state.fromLink || h !== loadedHash){ try { localStorage.setItem("hlts-own", h); } catch (e) {} }
  }
}
document.querySelectorAll(".levelSeg button").forEach(b => b.addEventListener("click", () => setSteps(b.dataset.steps === "1")));
$("linkCur").addEventListener("change", (e) => { state.linkCur = e.target.checked; update(); });
$("tHours").addEventListener("input", (e) => { state.t = +e.target.value; state.week = null; update(); });
$("sHours").addEventListener("input", (e) => { state.s = +e.target.value; state.week = null; update(); });
$("linkGoals").addEventListener("change", (e) => { state.linkGoals = e.target.checked; update(); });
$("nativeSearch").addEventListener("change", (e) => {
  const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const hit = ALL_NATIVE.find(n => n[0].toLowerCase() === v || nameOf(n[1], n[0]).toLowerCase() === v);
  state.native = hit ? hit[1] : "other"; update();
});
$("pageLang").addEventListener("change", (e) => {
  if (!STR[e.target.value]) return;
  state.lang = e.target.value;
  try { localStorage.setItem("hlts-lang", state.lang); } catch (err) {}
  renderStatic(); update();
});
/* Cookie banner: only for visitors in Europe (see the Google tag at the top of the page). */
(function(){
  if (!window.needsConsent) return;
  const box = $("consent"), open = $("consentOpen");
  let choice = null; try { choice = localStorage.getItem("hlt-consent"); } catch (e) {}
  open.hidden = false;
  const save = (v) => { try { localStorage.setItem("hlt-consent", v); } catch (e) {} box.hidden = true; };
  if (choice !== "yes" && choice !== "no") box.hidden = false;
  $("consentYes").addEventListener("click", () => {
    save("yes"); window.loadGA(); gtag("consent", "update", { analytics_storage: "granted" });
  });
  $("consentNo").addEventListener("click", () => {
    save("no"); gtag("consent", "update", { analytics_storage: "denied" });
    // remove Analytics cookies if they were set earlier
    document.cookie.split(";").map(c => c.split("=")[0].trim()).filter(n => /^_ga/.test(n)).forEach(n => {
      const host = location.hostname;
      ["", "; domain=" + host, "; domain=." + host].forEach(d => { document.cookie = n + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/" + d; });
    });
  });
  open.addEventListener("click", () => { box.hidden = false; $("consentYes").focus(); });
})();
/* first visit: the browser's language if we have it, otherwise English */
try {
  const saved = localStorage.getItem("hlts-lang");
  const fromBrowser = (navigator.languages || [navigator.language]).map(l => (l || "").slice(0, 2)).find(l => STR[l]);
  state.lang = STR[saved] ? saved : (fromBrowser || "en");
} catch (err) {}
$("goBtn").addEventListener("click", () => {
  const smoothNow = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!state.native){
    // the native language changes the estimate, so we ask for it first: go up to step 2 and nudge it
    const box = $("stepNative"), msg = $("needNative");
    msg.hidden = false;
    box.classList.remove("need-pick"); void box.offsetWidth; box.classList.add("need-pick");
    const y = box.getBoundingClientRect().top + window.scrollY - 16;
    window.scrollTo({ top: Math.max(0, y), behavior: smoothNow ? "smooth" : "auto" });
    const first = box.querySelector(".chip"); if (first) first.focus({ preventScroll: true });
    return;
  }
  state.shown = true; update();
  // show the top of the result: on phones it sits under the form; on wide screens it starts at the top of the grid
  const narrow = window.matchMedia("(max-width:920px)").matches;
  const target = narrow ? $("result") : document.querySelector(".grid");
  const y = target.getBoundingClientRect().top + window.scrollY - 16;
  const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: Math.max(0, y), behavior: smooth ? "smooth" : "auto" });
});

/* Theme: light by default; the visitor's own pick is remembered in this browser only. */
function setTheme(th, save){
  document.documentElement.classList.toggle("dark", th === "dark");
  document.querySelectorAll("#themeSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.themePick === th ? "true" : "false"));
  if (save){ try { localStorage.setItem("hlts-theme", th); } catch (e) {} }
}
document.querySelectorAll("#themeSeg button").forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themePick, true)));
let savedTheme = "light";
try { if (localStorage.getItem("hlts-theme") === "dark") savedTheme = "dark"; } catch (e) {}

const DEFAULTS = JSON.stringify({ ...state, purposes: [...state.purposes] });
function startOwn(){
  const d = JSON.parse(DEFAULTS);
  Object.assign(state, d, { purposes: new Set(d.purposes), lang: state.lang, shown: false, torn: false, week: null, fromLink: false });
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  $("sharedBar").hidden = true;
  update();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("ownBtn").addEventListener("click", startOwn);
$("sharedClose").addEventListener("click", () => { $("sharedBar").hidden = true; });
if (decodeState(location.hash)){
  state.shown = true; loadedHash = encodeState();
  let own = null; try { own = localStorage.getItem("hlts-own"); } catch (e) {}
  if (loadedHash !== own){ state.fromLink = true; $("sharedBar").hidden = false; }
}
renderStatic();
setTheme(savedTheme, false);
update();
</script>
